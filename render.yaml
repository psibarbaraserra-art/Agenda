# Configuração de publicação no Render (https://render.com)
services:
  - type: web
    name: mindcorp
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/session
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: mindcorp-dados
      mountPath: /var/data
      sizeGB: 1
