<title>Plataforma MindCorp</title>
<meta name="description" content="Demonstração da plataforma MindCorp de saúde mental organizacional e NR-1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* MindCorp – identidade visual
   Paleta: #0D2B45 (marinho) · #155E7A (petróleo) · #2DA6B0 (turquesa) · #A7C7D6 (azul névoa) · #F2F5F7 (gelo) */
:root {
  --navy: #0D2B45;
  --petrol: #155E7A;
  --teal: #2DA6B0;
  --mist: #A7C7D6;
  --ice: #F2F5F7;
  --white: #FFFFFF;
  --text: #0D2B45;
  --muted: #5B7083;
  --line: #DCE6EC;
  --danger: #C8382E;
  --r-baixo: #2E9E6A;
  --r-moderado: #D9A520;
  --r-alto: #E07B24;
  --r-critico: #C8382E;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(13, 43, 69, .06), 0 4px 16px rgba(13, 43, 69, .06);
  --font: 'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); color: var(--text); background: var(--ice); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--petrol); }
h1, h2, h3, h4 { margin: 0 0 .5em; line-height: 1.25; color: var(--navy); }
h1 { font-size: 1.6rem; font-weight: 700; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 700; }
p { margin: 0 0 .8em; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.upper { text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; font-weight: 600; }
.accent { color: var(--teal); }
hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }

/* ---------- Layout ---------- */
.app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
.sidebar { background: var(--white); border-right: 1px solid var(--line); padding: 22px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
.sidebar .brand { padding: 0 8px 18px; }
.sidebar .brand img { width: 190px; max-width: 100%; display: block; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--navy); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--ice); }
.nav a.active { background: var(--navy); color: var(--white); }
.nav a.active svg { stroke: var(--teal); }
.nav svg { width: 18px; height: 18px; stroke: var(--petrol); fill: none; stroke-width: 2; flex: none; }
.sidebar .foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); font-size: .82rem; }
.main { min-width: 0; }
.topbar { background: var(--navy); color: var(--white); padding: 14px 32px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.topbar .tag { font-weight: 600; letter-spacing: .04em; font-size: .85rem; text-transform: uppercase; }
.topbar .tag span { color: var(--teal); }
.topbar .who { font-size: .85rem; opacity: .9; }
.content { padding: 28px 32px 60px; max-width: 1240px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head p { margin: 0; }
.menu-btn { display: none; background: none; border: 0; color: var(--white); cursor: pointer; padding: 4px; }

/* ---------- Componentes ---------- */
.card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; border: 1px solid var(--line); }
.card + .card { margin-top: 18px; }
.grid > .card + .card { margin-top: 0; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head h2, .card-head h3 { margin: 0; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stat { background: var(--white); border-radius: var(--radius); padding: 18px; border: 1px solid var(--line); box-shadow: var(--shadow); }
.stat .v { font-size: 1.9rem; font-weight: 700; color: var(--navy); line-height: 1.1; }
.stat .l { color: var(--muted); font-size: .85rem; margin-top: 4px; }
.stat.hl { background: linear-gradient(135deg, var(--navy), var(--petrol)); color: var(--white); border: 0; }
.stat.hl .v { color: var(--white); }
.stat.hl .l { color: var(--mist); }

.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; background: var(--petrol); color: var(--white); padding: 9px 16px; border-radius: 10px; font: inherit; font-weight: 600; font-size: .9rem; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--navy); }
.btn.teal { background: var(--teal); }
.btn.teal:hover { background: var(--petrol); }
.btn.ghost { background: var(--white); color: var(--petrol); border-color: var(--line); }
.btn.ghost:hover { background: var(--ice); }
.btn.danger { background: var(--white); color: var(--danger); border-color: #f0cfcc; }
.btn.danger:hover { background: #fdf1f0; }
.btn.sm { padding: 6px 11px; font-size: .82rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

label { display: block; font-weight: 600; font-size: .85rem; margin-bottom: 5px; color: var(--navy); }
.field { margin-bottom: 14px; }
input, select, textarea { width: 100%; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--white); color: var(--text); }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--teal); outline-offset: -1px; border-color: var(--teal); }
textarea { min-height: 90px; resize: vertical; }
textarea.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; min-height: 360px; }
.hint { font-size: .8rem; color: var(--muted); margin-top: 4px; }
.row { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; }
.check input { width: auto; margin-top: 4px; }

table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 9px 10px; border-bottom: 2px solid var(--line); }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--ice); }
.table-wrap { overflow-x: auto; }

.badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: .75rem; font-weight: 600; background: var(--ice); color: var(--petrol); border: 1px solid var(--line); white-space: nowrap; }
.badge.ok { background: #e6f5ee; color: #1f7a50; border-color: #c4e8d5; }
.badge.warn { background: #fdf5e0; color: #8a6510; border-color: #f2e0ad; }
.badge.off { background: #f1f1f1; color: #777; }
.badge.navy { background: var(--navy); color: var(--white); border-color: var(--navy); }
.lvl { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: .78rem; font-weight: 700; color: var(--white); }
.lvl.baixo { background: var(--r-baixo); }
.lvl.moderado { background: var(--r-moderado); }
.lvl.alto { background: var(--r-alto); }
.lvl.critico { background: var(--r-critico); }

.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 20px; flex-wrap: wrap; }
.tabs a { padding: 10px 16px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs a.active { color: var(--navy); border-color: var(--teal); }

.empty { text-align: center; padding: 36px 20px; color: var(--muted); }
.empty svg { width: 42px; height: 42px; stroke: var(--mist); fill: none; stroke-width: 1.5; margin-bottom: 8px; }

.list-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }
.date-chip { background: var(--navy); color: var(--white); border-radius: 10px; padding: 6px 10px; text-align: center; min-width: 54px; line-height: 1.1; flex: none; }
.date-chip b { display: block; font-size: 1.2rem; }
.date-chip span { font-size: .7rem; text-transform: uppercase; color: var(--mist); }

.mat-card { display: flex; flex-direction: column; gap: 6px; cursor: pointer; transition: transform .1s; }
.mat-card:hover { transform: translateY(-2px); border-color: var(--mist); }
.mat-card .cat { color: var(--teal); }
.mat-card h3 { margin: 0; }
.mat-card p { margin: 0; font-size: .88rem; color: var(--muted); flex: 1; }

.linkbox { display: flex; gap: 8px; align-items: center; background: var(--ice); border: 1px dashed var(--mist); border-radius: 10px; padding: 10px 12px; }
.linkbox code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .85rem; color: var(--petrol); }
.qr { width: 180px; height: 180px; background: var(--white); border-radius: 10px; padding: 8px; border: 1px solid var(--line); }
.qr svg, .qr img { width: 100%; height: 100%; }

/* Markdown */
.md h2 { margin-top: 1.4em; color: var(--petrol); }
.md h1 { color: var(--navy); }
.md ul { padding-left: 1.2em; }
.md li { margin-bottom: .35em; }
.md li::marker { color: var(--teal); }
.md blockquote { margin: 1em 0; padding: 10px 14px; border-left: 4px solid var(--teal); background: var(--ice); border-radius: 0 8px 8px 0; color: var(--muted); }

/* Barras / gráficos */
.bar { height: 10px; background: var(--ice); border-radius: 99px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.stack { height: 18px; border-radius: 6px; overflow: hidden; display: flex; font-size: .7rem; color: var(--white); font-weight: 600; }
.stack i { display: flex; align-items: center; justify-content: center; font-style: normal; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
.heat td.h { text-align: center; font-weight: 700; color: var(--white); border: 2px solid var(--white); }
.matrix { display: grid; grid-template-columns: 34px repeat(5, 1fr); gap: 3px; font-size: .75rem; }
.matrix div { padding: 8px 4px; text-align: center; border-radius: 4px; min-height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.matrix .ax { color: var(--muted); font-weight: 600; background: none; }
.matrix .cell { color: var(--white); font-weight: 600; }
.matrix .cell em { font-style: normal; font-size: .65rem; opacity: .95; display: block; line-height: 1.2; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(13, 43, 69, .55); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow-y: auto; }
.modal { background: var(--white); border-radius: 14px; width: 100%; max-width: 640px; padding: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); }
.modal.wide { max-width: 920px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-head h2 { margin: 0; }
.x { background: none; border: 0; font-size: 1.6rem; cursor: pointer; color: var(--muted); line-height: 1; }

.toast { position: fixed; bottom: 20px; right: 20px; background: var(--navy); color: var(--white); padding: 12px 18px; border-radius: 10px; box-shadow: var(--shadow); z-index: 100; font-weight: 500; border-left: 4px solid var(--teal); }
.toast.err { border-left-color: var(--danger); }

/* Autenticação */
.auth-wrap { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.auth-side { background: linear-gradient(160deg, var(--navy) 0%, var(--petrol) 100%); color: var(--white); padding: 56px; display: flex; flex-direction: column; justify-content: center; }
.auth-side h1 { color: var(--white); font-size: 2rem; text-transform: uppercase; letter-spacing: .02em; }
.auth-side h1 span { color: var(--teal); }
.auth-side .pillars { display: grid; gap: 14px; margin-top: 28px; }
.auth-side .pillars div { border-left: 3px solid var(--teal); padding-left: 12px; }
.auth-side .pillars b { display: block; text-transform: uppercase; font-size: .82rem; letter-spacing: .06em; }
.auth-side .pillars small { color: var(--mist); }
.auth-form { display: flex; align-items: center; justify-content: center; padding: 40px 24px; background: var(--white); }
.auth-form form { width: 100%; max-width: 380px; }
.auth-form img { width: 240px; margin-bottom: 26px; }

/* Apresentação de palestra */
.present { position: fixed; inset: 0; background: var(--navy); color: var(--white); z-index: 200; display: flex; flex-direction: column; }
.present .slide { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 6vh 9vw; }
.present .slide h1 { color: var(--white); font-size: clamp(2rem, 5vw, 3.6rem); text-transform: uppercase; }
.present .slide h2 { color: var(--teal); font-size: clamp(1.2rem, 2.6vw, 2rem); font-weight: 500; }
.present .slide ul { font-size: clamp(1.1rem, 2.4vw, 1.8rem); padding-left: 1.2em; }
.present .slide li { margin-bottom: .5em; }
.present .slide li::marker { color: var(--teal); }
.present .slide p { font-size: clamp(1.1rem, 2.2vw, 1.6rem); }
.present .slide strong { color: var(--teal); }
.present .notes { background: rgba(255, 255, 255, .08); padding: 10px 9vw; font-size: .9rem; color: var(--mist); }
.present .bar-b { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: rgba(0, 0, 0, .2); }
.present .bar-b img { height: 34px; background: var(--white); border-radius: 6px; padding: 3px 8px; }
.present .bar-b .btn { background: rgba(255, 255, 255, .12); }

/* ---------- Relatório (impressão) ---------- */
.report { background: var(--white); max-width: 960px; margin: 0 auto; padding: 0; box-shadow: var(--shadow); border-radius: var(--radius); overflow: hidden; }
.report section { padding: 26px 36px; border-bottom: 1px solid var(--line); page-break-inside: avoid; }
.report .cover { background: var(--navy); color: var(--white); padding: 40px 36px; }
.report .cover h1 { color: var(--white); font-size: 1.8rem; margin-top: 18px; }
.report .cover .logo { background: var(--white); border-radius: 10px; padding: 8px 14px; display: inline-block; }
.report .cover .logo img { height: 52px; display: block; }
.report .cover .meta { color: var(--mist); }
.report .cover .tagline { margin-top: 26px; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; }
.report .cover .tagline span { color: var(--teal); }
.report h2 { border-left: 4px solid var(--teal); padding-left: 10px; }
.report .sig { margin-top: 50px; text-align: center; }
.report .sig .line { border-top: 1px solid var(--navy); width: 300px; margin: 0 auto 6px; }
.report-toolbar { max-width: 960px; margin: 0 auto 16px; }
.print-only { display: none; }

@media print {
  @page { size: A4; margin: 12mm; }
  body { background: var(--white); font-size: 11.5px; }
  .sidebar, .topbar, .report-toolbar, .no-print, .toast, .modal-bg { display: none !important; }
  .app { display: block; }
  .content { padding: 0; max-width: none; }
  .report { box-shadow: none; border-radius: 0; max-width: none; }
  .report section { padding: 14px 6px; }
  .print-only { display: block; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page-break { page-break-before: always; }
}

/* ---------- Responsivo ---------- */
@media (max-width: 960px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .auth-wrap { grid-template-columns: 1fr; }
  .auth-side { padding: 36px 24px; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; z-index: 60; width: 260px; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  .sidebar.open { transform: none; }
  .menu-btn { display: block; }
  .topbar { padding: 12px 16px; }
  .topbar .tag { font-size: .7rem; }
  .content { padding: 20px 16px 50px; }
  .g2, .g3 { grid-template-columns: 1fr; }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .stat .v { font-size: 1.5rem; }
  .demo-pill .long { display: none; }
  .report section { padding: 18px 16px; }
}

@media print {
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

/* Versão de demonstração */
.demo-pill { background: var(--teal); color: var(--white); border-radius: 99px; padding: 4px 12px; font-size: .75rem; font-weight: 600; }
.demo-pill ~ .who { display: none; }
.portal-back { background: var(--teal); color: var(--white); padding: 10px 0; font-size: .9rem; }
.portal-back .p-wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.portal-back button { background: var(--white); color: var(--navy); border: 0; border-radius: 8px; padding: 6px 12px; font: inherit; font-weight: 600; cursor: pointer; }

body { background: var(--ice); }
.p-wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.p-head { background: var(--white); border-bottom: 1px solid var(--line); }
.p-head .p-wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
.p-logo { height: 46px; }
.p-co { font-weight: 600; color: var(--petrol); text-align: right; font-size: .9rem; }
.p-band { background: var(--navy); color: var(--white); padding: 10px 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.p-band span { color: var(--teal); }
main.p-wrap { padding-top: 24px; padding-bottom: 40px; min-height: 60vh; }
.p-foot { background: var(--navy); color: var(--mist); text-align: center; padding: 18px 0; font-size: .85rem; }
.p-hero { background: linear-gradient(135deg, var(--navy), var(--petrol)); color: var(--white); border-radius: 16px; padding: 24px; margin-bottom: 18px; }
.p-hero h1 { color: var(--white); font-size: 1.4rem; }
.p-hero p { color: var(--mist); margin: 0; }
.p-cta { display: block; background: var(--teal); color: var(--white); text-decoration: none; border-radius: 14px; padding: 18px; margin-bottom: 12px; font-weight: 600; }
.p-cta small { display: block; font-weight: 400; opacity: .9; }
.opts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.opts label { margin: 0; }
.opts input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opts span { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 52px; padding: 6px 4px; border: 1px solid var(--line); border-radius: 10px; font-size: .75rem; font-weight: 600; cursor: pointer; background: var(--white); color: var(--navy); line-height: 1.15; }
.opts input:checked + span { background: var(--petrol); color: var(--white); border-color: var(--petrol); }
.opts input:focus-visible + span { outline: 2px solid var(--teal); outline-offset: 2px; }
.q { padding: 16px 0; border-bottom: 1px solid var(--line); }
.q:last-child { border-bottom: 0; }
.q.missing p { color: var(--danger); }
.q p { margin: 0; font-weight: 500; }
.progress { height: 8px; background: var(--white); border-radius: 99px; overflow: hidden; margin-bottom: 16px; border: 1px solid var(--line); }
.progress i { display: block; height: 100%; background: var(--teal); transition: width .2s; }
.stars { display: flex; gap: 8px; }
.stars label { margin: 0; }
.stars input { position: absolute; opacity: 0; }
.stars span { font-size: 2.2rem; cursor: pointer; color: var(--mist); }
.stars input:checked ~ span, .stars span.on { color: var(--teal); }
.support { background: #fff8e6; border: 1px solid #f2e0ad; border-radius: 12px; padding: 14px; font-size: .9rem; }
@media (max-width: 600px) {
  .opts { grid-template-columns: 1fr; gap: 6px; }
  .opts span { min-height: 44px; font-size: .9rem; justify-content: flex-start; padding: 8px 14px; }
  .p-logo { height: 36px; }
  .p-co { font-size: .8rem; }
}

/* ---------- Portfólio ---------- */
main.pf-root { max-width: 1080px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
body.pf .p-wrap { max-width: 1080px; }
.pf-hero { background: linear-gradient(140deg, var(--navy) 0%, var(--petrol) 100%); color: var(--white); border-radius: 18px; padding: clamp(28px, 6vw, 64px); display: grid; gap: 14px; justify-items: start; }
.pf-hero h1 { color: var(--white); font-size: clamp(1.7rem, 4.4vw, 2.9rem); text-transform: uppercase; letter-spacing: .01em; max-width: 20ch; text-wrap: balance; margin: 0; }
.pf-sub { color: var(--mist); font-size: clamp(1rem, 2vw, 1.2rem); margin: 0; max-width: 46ch; }
.pf-tag { margin: 0; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; font-size: .85rem; }
.pf-tag span { color: var(--teal); }
.pf-for { background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .25); border-radius: 99px; padding: 5px 14px; font-size: .85rem; }
.pf-btn { margin-top: 8px; }
.pf-sec { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: clamp(22px, 4vw, 40px); }
.pf-sec h2 { font-size: clamp(1.25rem, 2.6vw, 1.6rem); text-wrap: balance; margin: 4px 0 14px; }
.pf-sec p { max-width: 68ch; }
.pf-about { display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; align-items: center; }
.pf-pillars, .pf-facts, .pf-deliv, .pf-talks { display: grid; gap: 12px; }
.pf-pillars div, .pf-facts div, .pf-deliv div, .pf-talks div, .pf-svc { border-left: 3px solid var(--teal); padding: 4px 0 4px 12px; display: grid; gap: 2px; }
.pf-pillars b { text-transform: uppercase; font-size: .82rem; letter-spacing: .05em; }
.pf-root small { color: var(--muted); }
.pf-facts { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; }
.pf-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 28px; }
.pf-group { display: grid; gap: 10px; align-content: start; }
.pf-group h3 { color: var(--petrol); margin: 0; font-size: .95rem; text-transform: uppercase; letter-spacing: .05em; }
.pf-steps { list-style: none; counter-reset: s; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.pf-steps li { counter-increment: s; background: var(--ice); border-radius: 12px; padding: 16px; display: grid; gap: 4px; align-content: start; }
.pf-steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: var(--white); display: grid; place-items: center; font-weight: 700; font-size: .9rem; margin-bottom: 4px; }
.pf-deliv { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 28px; }
.pf-talks { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 28px; }
.pf-talks .badge { justify-self: start; margin-top: 4px; }
.pf-ethics ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.pf-ethics li::marker { color: var(--teal); }
.pf-who { display: flex; gap: 24px; align-items: center; }
.pf-who img { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 4px solid var(--mist); flex: none; }
.pf-who > div { min-width: 0; }
.pf-contact { background: var(--navy); color: var(--white); border-radius: 18px; padding: clamp(24px, 5vw, 48px); display: grid; gap: 18px; }
.pf-contact h2 { color: var(--white); margin: 0; font-size: clamp(1.3rem, 3vw, 1.8rem); text-wrap: balance; }
.pf-cgrid { display: flex; flex-wrap: wrap; gap: 14px 32px; align-items: center; }
.pf-cgrid div { display: grid; gap: 2px; }
.pf-cgrid small { color: var(--mist); text-transform: uppercase; font-size: .7rem; letter-spacing: .08em; }
.pf-cgrid a:not(.btn) { color: var(--white); font-weight: 600; }
.pf-cgrid .sel { user-select: all; }
@media (max-width: 760px) {
  .pf-about, .pf-facts, .pf-groups, .pf-deliv, .pf-talks { grid-template-columns: 1fr; }
  .pf-steps { grid-template-columns: 1fr; }
  .pf-who { flex-direction: column; align-items: flex-start; }
}

`## O que é a NR-1?
A Norma Regulamentadora nº 1 trata do **Gerenciamento de Riscos Ocupacionais (GRO)**. Desde a sua atualização, as empresas devem identificar e controlar também os **fatores de risco psicossociais** – condições de organização do trabalho que podem afetar a saúde mental.

## Exemplos de fatores psicossociais
- Sobrecarga de trabalho e prazos irrealistas
- Falta de clareza sobre funções e responsabilidades
- Falta de apoio da liderança e dos colegas
- Assédio moral, sexual e discriminação
- Jornadas extensas e dificuldade de desconectar
- Falta de reconhecimento e de comunicação

## Como você participa?
- Respondendo à **pesquisa anônima** com sinceridade
- Participando das palestras, rodas de conversa e treinamentos

'use strict';
const { DIMENSIONS } = require('./questionnaire');

const FAV_MAX = 37.5;   // pontuação de risco ≤ 37,5 → favorável
const DESF_MIN = 62.5;  // pontuação de risco ≥ 62,5 → desfavorável

const LEVELS = [
  { min: 1, max: 4, key: 'baixo', label: 'Baixo', priority: 'Manter controles e monitorar', deadline: 'Reavaliar em 12 meses' },
  { min: 5, max: 9, key: 'moderado', label: 'Moderado', priority: 'Ações de melhoria planejadas', deadline: 'Até 6 meses' },
  { min: 10, max: 14, key: 'alto', label: 'Alto', priority: 'Ações prioritárias', deadline: 'Até 90 dias' },
  { min: 15, max: 25, key: 'critico', label: 'Crítico', priority: 'Intervenção imediata', deadline: 'Imediato / até 30 dias' }
];

const PROB_LABELS = { 1: 'Rara', 2: 'Improvável', 3: 'Possível', 4: 'Provável', 5: 'Muito provável' };
const SEV_LABELS = { 1: 'Insignificante', 2: 'Leve', 3: 'Moderada', 4: 'Grave', 5: 'Gravíssima' };

function itemRisk(item, value) {
  const v = Number(value);
  if (!(v >= 1 && v <= 5)) return null;
  return item.dir === 'neg' ? ((v - 1) / 4) * 100 : ((5 - v) / 4) * 100;
}

function mean(arr) {
  const a = arr.filter(x => x !== null && x !== undefined && !Number.isNaN(x));
  return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
}

/** Probabilidade (1–5) a partir do % de respondentes em situação desfavorável. */
function probabilityFromExposure(pctDesf) {
  if (pctDesf < 10) return 1;
  if (pctDesf < 20) return 2;
  if (pctDesf < 35) return 3;
  if (pctDesf < 50) return 4;
  return 5;
}

/** Para assédio/violência: qualquer ocorrência relatada já é relevante. */
function probabilityFromPrevalence(pct) {
  if (pct === 0) return 1;
  if (pct < 5) return 2;
  if (pct < 10) return 3;
  if (pct < 20) return 4;
  return 5;
}

function levelFor(r) {
  return LEVELS.find(l => r >= l.min && r <= l.max) || LEVELS[0];
}

/** Pontuações por dimensão para um único respondente. */
function scoreResponse(resp) {
  const out = {};
  for (const d of DIMENSIONS) {
    const risks = d.items.map(i => itemRisk(i, resp.answers?.[i.id]));
    const m = mean(risks);
    let exposed = false;
    if (d.prevalence) {
      exposed = d.items.some(i => i.exposure && Number(resp.answers?.[i.id]) >= 2);
    }
    out[d.id] = { score: m, exposed };
  }
  return out;
}

  const scored = responses.map(scoreResponse);
  const dims = DIMENSIONS.map(d => {
    const scores = scored.map(s => s[d.id].score).filter(x => x !== null);
    const n = scores.length;
    const m = mean(scores);
    const fav = n ? (scores.filter(x => x <= FAV_MAX).length / n) * 100 : 0;
    const desf = n ? (scores.filter(x => x >= DESF_MIN).length / n) * 100 : 0;

    });

      risk, level: level.key, levelLabel: level.label, priority: level.priority, deadline: level.deadline,
      items
    };
  });

}

/**
 * Relatório completo de uma campanha.
 * Respeita o tamanho mínimo de grupo para preservar o anonimato.
 */
function buildReport(campaign, company, responses) {

  const severity = campaign.severity || {};
  const total = responses.length;
  const enough = total >= minGroup;

  const headcount = (company?.sectors || []).reduce((s, x) => s + (Number(x.headcount) || 0), 0) || Number(company?.employees) || 0;

  const participation = sectorNames.map(name => {
    const sec = (company?.sectors || []).find(s => s.name === name);
    const count = responses.filter(r => (r.sector || 'Não informado') === name).length;
    const hc = Number(sec?.headcount) || 0;
    return { sector: name, responses: count, headcount: hc, rate: hc ? round((count / hc) * 100) : null };
  });

  // Análise por setor (somente grupos ≥ minGroup; os demais são agrupados)
  const sectors = [];
  const small = [];
  for (const p of participation) {
    const group = responses.filter(r => (r.sector || 'Não informado') === p.sector);
    if (group.length >= minGroup) {
      const a = analyzeGroup(group, severity);
      sectors.push({ sector: p.sector, n: group.length, overall: a.overall, dimensions: a.dimensions.map(d => ({ id: d.id, score: d.score, desfavoravel: d.desfavoravel, risk: d.risk, level: d.level, levelLabel: d.levelLabel })) });

    }

  if (small.length >= minGroup && sectors.length > 0) {
    const a = analyzeGroup(small, severity);
    groupedOthers = { sector: 'Demais setores (agrupados)', n: small.length, overall: a.overall, dimensions: a.dimensions.map(d => ({ id: d.id, score: d.score, desfavoravel: d.desfavoravel, risk: d.risk, level: d.level, levelLabel: d.levelLabel })) };
    sectors.push(groupedOthers);
  }

  const comments = enough
    ? shuffle(responses.map(r => (r.comment || '').trim()).filter(Boolean))
    : [];

  if (general) general.dimensions.forEach(d => { if (d.id !== 'saude') counts[d.level]++; });

    generatedAt: new Date().toISOString(),
    campaign: { id: campaign.id, title: campaign.title, startDate: campaign.startDate, endDate: campaign.endDate, status: campaign.status },
    company: company ? { id: company.id, name: company.name, cnpj: company.cnpj, segment: company.segment } : null,
    minGroup,
    totalResponses: total,
    headcount,
    adhesion: headcount ? round((total / headcount) * 100) : null,
    enough,
    general,
    levelCounts: counts,
    participation,
    sectors,
    hiddenSectors: participation.filter(p => p.responses > 0 && p.responses < minGroup).map(p => p.sector),
    comments,
    levels: LEVELS,
    methodology: {
      favMax: FAV_MAX, desfMin: DESF_MIN,
      probability: 'Probabilidade (1–5) estimada pelo percentual de trabalhadores em situação desfavorável na dimensão: <10% = 1; 10–19% = 2; 20–34% = 3; 35–49% = 4; ≥50% = 5. Para assédio/violência/discriminação considera-se também a prevalência de qualquer ocorrência relatada: 0% = 1; <5% = 2; 5–9% = 3; 10–19% = 4; ≥20% = 5.',

      matrix: 'Nível de risco = Probabilidade × Severidade (matriz 5×5): 1–4 Baixo; 5–9 Moderado; 10–14 Alto; 15–25 Crítico.'
    }
  };
}

  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }

  /** Markdown simplificado: # ## ###, listas "- ", > citações, **negrito**, *itálico*, links. */
  function md(src) {

      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>')
      .replace(/\b(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    const lines = String(src || '').split(/\r?\n/);

    const close = () => { if (list) { html += '</ul>'; list = false; } };
    for (const raw of lines) {
      const l = raw.trimEnd();
      let m;
      if ((m = l.match(/^(#{1,3})\s+(.*)/))) { close(); const n = m[1].length; html += `<h${n}>${inline(m[2])}</h${n}>`; }
      else if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if (!list) { html += '<ul>'; list = true; } html += `<li>${inline(m[1])}</li>`; }
      else if ((m = l.match(/^>\s?(.*)/))) { close(); html += `<blockquote>${inline(m[1])}</blockquote>`; }

      q.addData(text.startsWith('#!') ? 'MindCorp demonstração: na versão publicada este QR Code abre o portal do colaborador.' : text);
      q.make();
      return q.createDataURL(6, 4);
    } catch { return ''; }
  }
  if (standalone) {
    // Links internos (#/…) navegam no painel; links "#!…" abrem a visão do colaborador
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const href = a.getAttribute('href');
      if (href === '#') return;
      e.preventDefault();
      if (href.startsWith('#!')) window.MC.openPortal(href.slice(2));
      else go(href);
    });
  }

  window.MC = {
    esc, md, slides, api, toast, fmtDate, dateChip, MONTHS,
    standalone, go, link, qr,
    logo: window.MC_LOGO || '/img/logo.png',
    current: () => (standalone ? current : location.hash),
    onNavigate: fn => (standalone ? listeners.push(fn) : window.addEventListener('hashchange', fn))
  };
})();

<script>

(function () {
  /* Armazenamento no navegador (com reserva em memória se o navegador bloquear) */
  const KEY = 'mindcorp-demo-v1';
  const EMPTY = () => ({ users: [], sessions: [], settings: {}, companies: [], deliveries: [], materials: [], campaigns: [], responses: [], feedback: [] });
  let db = null;
  const rnd = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return a; };
  const store = {
    load() {
      if (db) return db;
      try { const raw = localStorage.getItem(KEY); db = raw ? Object.assign(EMPTY(), JSON.parse(raw)) : EMPTY(); } catch (e) { db = EMPTY(); }
      return db;
    },
    save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* segue só em memória */ } },
    id: () => (crypto.randomUUID ? crypto.randomUUID() : Array.from(rnd(16), b => b.toString(16).padStart(2, '0')).join('')),
    token: () => btoa(String.fromCharCode(...rnd(9))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
  };
  async function sha(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
  }
  const hashPassword = async (pw, salt = store.token()) => ({ salt, hash: await sha(salt + pw) });
  const checkPassword = async (pw, user) => (await sha(user.salt + pw)) === user.hash;

  /* Dados de exemplo e acesso automático da consultora */
  store.load();
  if (!db.companies.length) __req('seed-demo')(store);
  if (!db.users.length) { db.users.push({ id: store.id(), name: 'Consultora MindCorp', email: 'demo@mindcorp.app', crp: '', salt: '', hash: '' }); store.save(); }
  let userId = db.users[0].id;

  const api = __req('api').createApi({ store, hashPassword, checkPassword });
  const realFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = async (input, init = {}) => {
    const url = new URL(typeof input === 'string' ? input : input.url, location.href);
    if (!url.pathname.startsWith('/api/')) return realFetch(input, init);
    const out = await api.handle({
      method: init.method || 'GET',
      path: url.pathname,
      query: Object.fromEntries(url.searchParams),
      body: init.body ? JSON.parse(init.body) : undefined
    }, { userId, ip: 'local', login: id => { userId = id; }, logout: () => {} });
    return new Response(JSON.stringify(out.body), { status: out.status, headers: { 'Content-Type': 'application/json' } });
  };

  MC.resetDemo = () => {
    try { localStorage.removeItem(KEY); Object.keys(localStorage).filter(k => k.startsWith('mc_')).forEach(k => localStorage.removeItem(k)); } catch (e) { /* ignora */ }
    location.reload();
  };

  /* Visão do colaborador (portal) dentro da mesma página */
  MC.openPortal = p => {
    const open = document.querySelector('.modal-bg'); if (open) open.remove();
    const root = document.getElementById('root');
    root.innerHTML = '<div class="portal-back"><div class="p-wrap"><span>' + (p.indexOf('/portfolio') === 0 ? 'Você está vendo o portfólio como a empresa vê ao abrir o link.' : 'Você está vendo o que o colaborador vê no celular.') + '</span><button id="pb" type="button">← Voltar ao painel</button></div></div>'
      + '<header class="p-head"><div class="p-wrap"><img src="' + MC.logo + '" alt="MindCorp – Saúde Mental Organizacional" class="p-logo"><span id="co" class="p-co"></span></div></header>'
      + '<div class="p-band"><div class="p-wrap">Ciência. Estratégia. <span>Cuidado.</span></div></div>'
      + '<main class="p-wrap" id="proot"><p class="muted">Carregando…</p></main>'
      + '<footer class="p-foot"><div class="p-wrap">MindCorp · Saúde Mental Organizacional<br><small>Precisa de ajuda agora? CVV 188 (24h) · SAMU 192</small></div></footer>';
    window.scrollTo(0, 0);
    document.getElementById('pb').onclick = () => MC.route();
    MC.runPortal(p, document.getElementById('proot'));
  };
})();

<script>
/* MindCorp – Portal do Colaborador (público, anônimo) */

  /* ------------------------------ Pesquisa ---------------------------- */
  async function survey(token) {
    const d = await api(`/api/public/survey/${token}`);

    const q = d.questionnaire;
    if (!d.open) return fail('Esta pesquisa está encerrada. Obrigado pelo interesse!');
    const doneKey = 'mc_done_' + token;
    const answers = {};
    let sector = '', comment = '';
    let step = -1; // -1 = termo, 0..n-1 = dimensões, n = final
    const n = q.dimensions.length;

    const draw = () => {
      window.scrollTo(0, 0);
      if (step === -1) {
        root.innerHTML = `<div class="card"><h1>${esc(q.intro.title)}</h1>${q.intro.text.map(t => `<p>${esc(t)}</p>`).join('')}

      }

        };

      <div class="field"><label>Qual a sua nota geral para esta ação?</label>${stars('rating')}</div>
      <div class="field"><label>O conteúdo será útil no seu dia a dia?</label>${stars('useful')}</div>
      <div class="field"><label>Comentário (opcional)</label><textarea id="cm" maxlength="1000"></textarea></div>
      <button class="btn teal" id="send" style="width:100%;justify-content:center">Enviar avaliação</button></div>`;
    root.querySelectorAll('.stars').forEach(g => g.querySelectorAll('input').forEach(inp => inp.onchange = () => {
      g.querySelectorAll('span').forEach(s => s.classList.toggle('on', Number(s.dataset.v) <= Number(inp.value)));
    }));
    root.querySelector('#send').onclick = async e => {
      const rating = root.querySelector('input[name=rating]:checked')?.value;
      const useful = root.querySelector('input[name=useful]:checked')?.value;
      if (!rating) return toast('Escolha uma nota', true);
      e.target.disabled = true;
      try {
        await api(`/api/public/feedback/${token}`, { method: 'POST', body: { rating, useful, comment: root.querySelector('#cm').value } });
        storage.set(key, '1');
        root.innerHTML = '<div class="card" style="text-align:center"><h1>Obrigado! 💙</h1><p>Sua avaliação nos ajuda a cuidar melhor de todos.</p></div>';
      } catch (err) { e.target.disabled = false; toast(err.message, true); }
    };
  }

  (async () => {
    try {
      if (parts[0] === 'portfolio') return await portfolioPage();
      if (parts[0] === 'p' && parts[2] === 'm') return await material(parts[1], parts[3]);
      if (parts[0] === 'p') return await portal(parts[1]);
      if (parts[0] === 'pesquisa') return await survey(parts[1]);
      if (parts[0] === 'feedback') return await feedback(parts[1]);
      fail('Página não encontrada.');
    } catch (err) { fail(err.message); }
  })();
}
  window.MC.runPortal = runPortal;
  if (!MC.standalone) runPortal(location.pathname + location.search, document.getElementById('root'));
})();

</script>
<script>
/* MindCorp – Painel da consultoria (SPA sem dependências) */
(function () {

  const root = document.getElementById('root');
  const S = { user: null, catalog: null };
  const LINK = MC.link;
  const go = h => MC.go(h);

  /* ------------------------------ Ícones ------------------------------ */
  const ICONS = {
    home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
    building: '<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/>',

    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',

    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    menu: '<path d="M3 6h18M3 12h18M3 18h18"/>'
  };
  const icon = n => `<svg viewBox="0 0 24 24">${ICONS[n]}</svg>`;

  const LEVEL_COLORS = { baixo: '#2E9E6A', moderado: '#D9A520', alto: '#E07B24', critico: '#C8382E' };
  const STATUS = { planejado: ['Planejado', 'warn'], realizado: ['Realizado', 'ok'], cancelado: ['Cancelado', 'off'] };
  const CATEGORIES = ['Cartilha', 'Guia', 'Exercício prático', 'Palestra', 'Vídeo', 'Comunicado'];
  const heatColor = s => s === null || s === undefined ? '#ccc' : s < 37.5 ? '#2E9E6A' : s < 50 ? '#9BB83A' : s < 62.5 ? '#E0A420' : s < 75 ? '#E07B24' : '#C8382E';

  /* ------------------------------ Modal ------------------------------- */
  function modal(title, body, { wide } = {}) {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true"><div class="modal-head"><h2>${esc(title)}</h2><button class="x" aria-label="Fechar">×</button></div><div class="modal-body">${body}</div></div>`;
    const close = () => bg.remove();
    bg.querySelector('.x').onclick = close;
    bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
    document.body.appendChild(bg);
    return { el: bg.querySelector('.modal-body'), close };
  }
  const formData = form => Object.fromEntries(new FormData(form).entries());
  const confirmBox = msg => new Promise(resolve => {
    const m = modal('Confirmar', `<p>${esc(msg)}</p><div class="btns" style="margin-top:16px"><button class="btn danger" id="yes">Confirmar</button><button class="btn ghost" id="no">Cancelar</button></div>`);
    m.el.querySelector('#yes').onclick = () => { m.close(); resolve(true); };
    m.el.querySelector('#no').onclick = () => { m.close(); resolve(false); };
  });
  const copy = async text => { try { await navigator.clipboard.writeText(text); toast('Link copiado!'); } catch { toast('Selecione o link e copie manualmente', true); } };
  const qrImg = text => `<div class="qr"><img alt="QR Code" src="${MC.qr(text)}"></div>`;
  const linkBox = (url, label = 'Ver como colaborador') => MC.standalone
    ? `<div class="linkbox"><code>Na versão publicada aqui aparece o link para enviar aos colaboradores.</code><a class="btn sm" href="${esc(url)}">${label}</a></div>`
    : `<div class="linkbox"><code>${esc(url)}</code><button class="btn sm ghost" data-copy="${esc(url)}">Copiar</button><a class="btn sm ghost" href="${esc(url)}" target="_blank" rel="noopener">Abrir</a></div>`;
  document.addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (b) copy(b.dataset.copy); });

  /* ------------------------------ Shell ------------------------------- */
  function shell(active, content) {
    document.body.classList.remove('pf');
    const nav = [
      ['#/', 'home', 'Início'], ['#/empresas', 'building', 'Empresas'], ['#/agenda', 'calendar', 'Agenda de serviços'],
      ['#/materiais', 'book', 'Materiais e palestras'], ['#/avaliacoes', 'chart', 'Avaliações NR-1'], ['#/portfolio', 'briefcase', 'Portfólio'], ['#/metodologia', 'shield', 'Metodologia'], ['#/backup', 'save', 'Cópia de segurança'], ['#/perfil', 'user', 'Meu perfil']
    ];
    root.innerHTML = `
      <div class="app">
        <aside class="sidebar" id="sb">
          <div class="brand"><img src="${MC.logo}" alt="MindCorp – Saúde Mental Organizacional"></div>
          <nav class="nav">${nav.map(([h, i, l]) => `<a href="${h}" class="${active === h ? 'active' : ''}">${icon(i)}${l}</a>`).join('')}</nav>
          <div class="foot"><div><b>${esc(S.user.name)}</b></div><div class="muted">${S.user.crp ? 'CRP ' + esc(S.user.crp) : esc(S.user.email)}</div>${MC.standalone ? '<a href="#" id="reset" class="small">Restaurar dados de exemplo</a>' : '<a href="#" id="logout" class="small">Sair</a>'}</div>
        </aside>
        <div class="main">
          <div class="topbar"><button class="menu-btn" id="mb" aria-label="Menu"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" fill="none" stroke-width="2">${ICONS.menu}</svg></button>
            <div class="tag">Ciência. Estratégia. <span>Cuidado.</span></div>${MC.standalone ? '<div class="demo-pill">Demonstração<span class="long"> · dados salvos só neste navegador</span></div>' : ''}<div class="who">Saúde mental estratégica para organizações mais inteligentes</div></div>
          <div class="content" id="content">${content}</div>
        </div>
      </div>`;

    if (lo) lo.onclick = async e => { e.preventDefault(); await api('/api/logout', { method: 'POST' }); S.user = null; go('#/'); boot(); };
    document.getElementById('mb').onclick = () => document.getElementById('sb').classList.toggle('open');
    return document.getElementById('content');
  }

  /* ------------------------- Autenticação ----------------------------- */
  function authScreen(setup) {
    root.innerHTML = `
      <div class="auth-wrap">
        <div class="auth-side">
          <h1>Mentes saudáveis.<br>Organizações fortes.<br>Resultados <span>sustentáveis.</span></h1>

          <div class="pillars">
            <div><b>Ciência que orienta</b><small>Decisões baseadas em evidências.</small></div>
            <div><b>Estratégia que transforma</b><small>Soluções personalizadas para cada organização.</small></div>
            <div><b>Cuidado que acolhe</b><small>Acolhimento, empatia e escuta qualificada.</small></div>
            <div><b>Resultados que geram impacto</b><small>Ambientes saudáveis, produtivos e sustentáveis.</small></div>
          </div>
        </div>
        <div class="auth-form">
          <form id="f">
            <img src="${MC.logo}" alt="MindCorp">
            <h2>${setup ? 'Primeiro acesso' : 'Entrar'}</h2>
            <p class="muted small">${setup ? 'Crie a conta da consultora responsável.' : 'Acesso restrito à equipe MindCorp.'}</p>
            ${setup ? `<div class="field"><label>Nome completo</label><input name="name" required></div>
            <div class="field"><label>CRP</label><input name="crp" placeholder="00/00000"></div>` : ''}
            <div class="field"><label>E-mail</label><input name="email" type="email" required autocomplete="username"></div>
            <div class="field"><label>Senha</label><input name="password" type="password" required minlength="${setup ? 8 : 1}" autocomplete="${setup ? 'new-password' : 'current-password'}"></div>
            <button class="btn" style="width:100%;justify-content:center">${setup ? 'Criar conta' : 'Entrar'}</button>
          </form>
        </div>
      </div>`;
    document.getElementById('f').onsubmit = async e => {
      e.preventDefault();
      try {
        const r = await api(setup ? '/api/setup' : '/api/login', { method: 'POST', body: formData(e.target) });
        S.user = r.user; route();
      } catch (err) { toast(err.message, true); }
    };
  }

  /* ----------------------------- Início ------------------------------- */
  async function pageHome() {
    const c = shell('#/', '<p class="muted">Carregando…</p>');
    const d = await api('/api/dashboard');
    c.innerHTML = `
      <div class="page-head"><div><h1>Olá, ${esc(S.user.name.split(' ')[0])}</h1><p class="muted">Visão geral dos seus atendimentos e avaliações.</p></div>
        <div class="btns"><a class="btn ghost" href="#/empresas?nova=1">+ Empresa</a><a class="btn ghost" href="#/agenda?novo=1">+ Serviço</a><a class="btn teal" href="#/avaliacoes?nova=1">+ Avaliação NR-1</a></div></div>
      ${backupReminder(d)}
      <div class="grid g4">
        <div class="stat hl"><div class="v">${d.companies}</div><div class="l">Empresas atendidas</div></div>
        <div class="stat"><div class="v">${d.deliveriesDone}</div><div class="l">Serviços realizados</div></div>
        <div class="stat"><div class="v">${d.responses}</div><div class="l">Respostas de colaboradores</div></div>
        <div class="stat"><div class="v">${d.feedbackAvg ?? '—'}</div><div class="l">Satisfação média (${d.feedback} avaliações)</div></div>
      </div>
      <div class="grid g2" style="margin-top:18px">
        <div class="card"><div class="card-head"><h2>Próximos serviços</h2><a href="#/agenda" class="small">Ver agenda</a></div>
          ${d.upcoming.length ? d.upcoming.map(u => `<div class="list-item"><div style="display:flex;gap:12px;align-items:center">${dateChip(u.date)}<div><b>${esc(u.title || svcName(u.serviceId))}</b><div class="muted small">${esc(u.companyName || '')} · ${esc(u.time || '')} ${esc(u.modality || '')}</div></div></div></div>`).join('') : empty('calendar', 'Nenhum serviço agendado.')}
        </div>
        <div class="card"><div class="card-head"><h2>Avaliações em andamento</h2><a href="#/avaliacoes" class="small">Ver todas</a></div>
          ${d.activeCampaigns.length ? d.activeCampaigns.map(a => `<div class="list-item"><div><b>${esc(a.companyName)}</b><div class="muted small">${esc(a.title)}</div></div><div class="btns"><span class="badge">${a.responses} respostas</span><a class="btn sm ghost" href="#/avaliacoes/${a.id}">Abrir</a></div></div>`).join('') : empty('chart', 'Nenhuma avaliação aberta.')}
        </div>
      </div>`;
  }
  const printBtn = tip => MC.standalone
    ? '<span class="muted small">Na versão instalada do app, aqui fica o botão <b>Imprimir / Salvar em PDF</b>.</span>'
    : `<button class="btn" data-print>Imprimir / Salvar em PDF</button>${tip ? '<span class="muted small">Dica: no diálogo de impressão escolha "Salvar como PDF" e ative "Gráficos de plano de fundo".</span>' : ''}`;
  document.addEventListener('click', e => { if (e.target.closest('[data-print]')) window.print(); });
  const empty = (i, t) => `<div class="empty">${icon(i)}<div>${esc(t)}</div></div>`;

  /* ----------------------------- Empresas ----------------------------- */
  async function pageCompanies(q) {
    const c = shell('#/empresas', '');

      <div class="page-head"><div><h1>Empresas</h1><p class="muted">Clientes atendidos pela MindCorp.</p></div><button class="btn" id="new">+ Nova empresa</button></div>
      <div class="card">${list.length ? `<div class="table-wrap"><table><thead><tr><th>Empresa</th><th>Segmento</th><th>Colaboradores</th><th>Serviços</th><th>Avaliações</th><th>Status</th></tr></thead><tbody>
        ${list.map(x => `<tr class="click" data-id="${x.id}"><td><b>${esc(x.name)}</b><div class="muted small">${esc(x.cnpj || '')}</div></td><td>${esc(x.segment || '—')}</td><td>${esc(x.employees || '—')}</td><td>${x.stats.deliveriesDone}/${x.stats.deliveries}</td><td>${x.stats.campaigns} <span class="muted small">(${x.stats.responses} resp.)</span></td><td><span class="badge ${x.status === 'ativa' ? 'ok' : 'off'}">${esc(x.status)}</span></td></tr>`).join('')}

  async function pageCompany(id, tab = 'resumo') {
    const c = shell('#/empresas', '<p class="muted">Carregando…</p>');
    const [co, deliveries, campaigns, materials] = await Promise.all([api(`/api/companies/${id}`), api(`/api/deliveries?companyId=${id}`), api(`/api/campaigns?companyId=${id}`), api('/api/materials')]);
    const portalUrl = LINK('/p/' + co.portalToken);
    const tabs = [['resumo', 'Resumo'], ['servicos', 'Serviços'], ['avaliacoes', 'Avaliações NR-1'], ['materiais', 'Materiais publicados'], ['portal', 'Portal do colaborador']];
    let body = '';

      body = `<div class="grid g2"><div class="card"><h3>Dados da empresa</h3>

          ${[['CNPJ', co.cnpj], ['Segmento', co.segment], ['Colaboradores', co.employees], ['Contato', [co.contactName, co.contactRole].filter(Boolean).join(' · ')], ['E-mail', co.email], ['Telefone', co.phone], ['Endereço', co.address], ['Início do contrato', fmtDate(co.contractStart)]].map(([k, v]) => `<tr><td class="muted" style="width:40%">${k}</td><td>${esc(v || '—')}</td></tr>`).join('')}
          </tbody></table>${co.notes ? `<p class="small muted" style="margin-top:10px">${esc(co.notes)}</p>` : ''}</div>
        <div class="card"><h3>Setores</h3>${co.sectors.length ? `<table><thead><tr><th>Setor</th><th>Pessoas</th></tr></thead><tbody>${co.sectors.map(s => `<tr><td>${esc(s.name)}</td><td>${s.headcount || '—'}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Nenhum setor cadastrado.</p>'}
          <div class="grid g2" style="margin-top:16px"><div class="stat"><div class="v">${co.stats.deliveriesDone}</div><div class="l">Serviços realizados</div></div><div class="stat"><div class="v">${co.stats.responses}</div><div class="l">Respostas na pesquisa</div></div></div></div></div>`;
    } else if (tab === 'servicos') {
      body = `<div class="card"><div class="card-head"><h2>Serviços</h2><button class="btn" id="nd">+ Agendar serviço</button></div>${deliveryList(deliveries, false)}</div>`;

  function present(m) {
    const ss = slides(m.body);
    let i = 0;
    const el = document.createElement('div');
    el.className = 'present';
    const draw = () => {
      el.innerHTML = `<div class="slide md">${ss[i].html}</div>${ss[i].notes ? `<div class="notes">Nota: ${esc(ss[i].notes)}</div>` : ''}
        <div class="bar-b"><img src="${MC.logo}" alt="MindCorp"><span>${i + 1} / ${ss.length}</span><div class="btns"><button class="btn sm" data-a="-1">←</button><button class="btn sm" data-a="1">→</button><button class="btn sm" data-a="x">Sair (Esc)</button></div></div>`;
      el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
    };
    const act = a => { if (a === 'x') { el.remove(); document.removeEventListener('keydown', key); if (document.fullscreenElement) document.exitFullscreen(); return; } i = Math.max(0, Math.min(ss.length - 1, i + Number(a))); draw(); };
    const key = e => { if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') act(1); else if (e.key === 'ArrowLeft' || e.key === 'PageUp') act(-1); else if (e.key === 'Escape') act('x'); };
    document.addEventListener('keydown', key);
    document.body.appendChild(el); draw();
    el.requestFullscreen?.().catch(() => {});
  }

      else body = `<div class="card"><div class="card-head"><div><h2>Matriz de risco por fator</h2><p class="muted small">A probabilidade é calculada pelas respostas. Ajuste a <b>severidade</b> conforme seu julgamento técnico e o contexto da empresa.</p></div><button class="btn" id="savesev">Salvar severidades</button></div>
        <div class="table-wrap"><table><thead><tr><th>Fator psicossocial</th><th>Pontuação</th><th>Desfavorável</th><th>Probabilidade</th><th>Severidade</th><th>Risco (P×S)</th></tr></thead><tbody>
        ${r.general.dimensions.map(d => `<tr><td><b>${esc(d.name)}</b>${d.prevalence !== null ? `<div class="small muted">${d.prevalence}% relataram ao menos uma ocorrência</div>` : ''}</td><td>${d.score}</td><td>${d.desfavoravel}%</td><td>${d.probability} – ${d.probabilityLabel}</td>
          <td><select class="sev" data-dim="${d.id}" style="width:auto">${[1, 2, 3, 4, 5].map(v => `<option value="${v}" ${v === d.severity ? 'selected' : ''}>${v}</option>`).join('')}</select></td><td><span class="lvl ${d.level}">${d.risk} · ${d.levelLabel}</span></td></tr>`).join('')}

          tr.innerHTML = `<td><select class="f">${dims.map(d => `<option value="${d.id}" ${d.id === x.factor ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}<option value="geral" ${x.factor === 'geral' ? 'selected' : ''}>Geral / programa</option></select></td>

          tb.appendChild(tr);
        };
        (a.actionPlan || []).forEach(addRow);
        c.querySelector('#addrow').onclick = () => addRow();

          let n = 0;
          r.general.dimensions.filter(d => d.level !== 'baixo').sort((x, y) => y.risk - x.risk).forEach(d => d.actions.forEach(act => {
            if (existing.has(act)) return;
            addRow({ factor: d.id, action: act, deadline: new Date(Date.now() + days[d.level] * 864e5).toISOString().slice(0, 10), status: 'Pendente' }); n++;

          toast(n ? `${n} ações sugeridas – revise e ajuste` : 'Nenhuma nova sugestão');

          toast('Plano de ação salvo');

      });

  function topItems(general, n) {
    const items = general.dimensions.flatMap(d => d.items.map(i => ({ ...i, dim: d.name }))).sort((a, b) => b.desfavoravel - a.desfavoravel).slice(0, n);
    return `<table><thead><tr><th>Afirmação</th><th>Fator</th><th>% desfavorável</th></tr></thead><tbody>${items.map(i => `<tr><td>${esc(i.text)}</td><td class="small muted">${esc(i.dim)}</td><td><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="width:90px"><i style="width:${i.desfavoravel}%;background:${heatColor(i.desfavoravel)}"></i></div>${i.desfavoravel}%</div></td></tr>`).join('')}</tbody></table>`;
  }

    c.innerHTML = `
      <div class="report-toolbar btns no-print"><a class="btn ghost" href="#/avaliacoes/${id}">← Voltar</a>${printBtn(true)}</div>

          <table style="color:#fff;margin-top:18px;max-width:620px"><tbody>
            ${[['Empresa', co.name], ['CNPJ', co.cnpj], ['Segmento', co.segment], ['Período de coleta', `${fmtDate(a.startDate)} a ${fmtDate(a.endDate)}`], ['Responsável técnica', `${u.name}${u.crp ? ' – CRP ' + u.crp : ''}`], ['Emissão', fmtDate(r.generatedAt)]].map(([k, v]) => `<tr><td style="border-color:rgba(255,255,255,.15);color:var(--mist);width:40%">${k}</td><td style="border-color:rgba(255,255,255,.15)">${esc(v || '—')}</td></tr>`).join('')}
          </tbody></table>
          <p class="tagline">Ciência. Estratégia. <span>Cuidado.</span></p>
        </section>

        <section>${H('Apresentação e fundamentação')}
          <p>A Norma Regulamentadora nº 1 (NR-1), com a redação dada pela Portaria MTE nº 1.419/2024, determina que o Gerenciamento de Riscos Ocupacionais (GRO) contemple os <b>fatores de risco psicossociais relacionados ao trabalho</b>, que devem ser identificados, avaliados e controlados, integrando o Inventário de Riscos e o Plano de Ação do Programa de Gerenciamento de Riscos (PGR).</p>
          <p>Este relatório apresenta os resultados da avaliação realizada pela MindCorp – Saúde Mental Organizacional junto a <b>${esc(co.name)}</b>, com o objetivo de identificar condições da organização do trabalho que representem risco à saúde mental dos trabalhadores e de propor medidas de prevenção, priorizadas segundo o nível de risco.</p>
          <p>Foram observados os princípios éticos do Código de Ética Profissional do Psicólogo, a Lei Geral de Proteção de Dados (Lei 13.709/2018) e as diretrizes de prevenção ao assédio da Lei 14.457/2022. <b>Nenhum resultado individual é apresentado</b>; o foco é a organização do trabalho, e não a avaliação de pessoas.</p>

        <section>${H('Metodologia')}

          ${dims.slice().sort((x, y) => y.risk - x.risk).map(d => `<tr><td><b>${esc(d.name)}</b></td><td>${esc(d.hazard)}</td><td>${esc(d.harms)}</td><td>${d.probability}</td><td>${d.severity}</td><td><span class="lvl ${d.level}">${d.levelLabel}</span></td><td class="small">${esc(d.priority)} – ${esc(d.deadline)}</td></tr>`).join('')}
          </tbody></table></div>
        </section>

        <section>${H('Pontos de atenção (itens mais desfavoráveis)')}${topItems(g, 8)}</section>`}

        <section>${H('Plano de ação')}
          ${a.actionPlan?.length ? `<div class="table-wrap"><table style="font-size:.85rem"><thead><tr><th>Fator</th><th>Medida</th><th>Responsável</th><th>Prazo</th><th>Status</th></tr></thead><tbody>${a.actionPlan.map(x => `<tr><td>${esc(dimName[x.factor] || x.factor)}</td><td>${esc(x.action)}</td><td>${esc(x.responsible || '—')}</td><td>${fmtDate(x.deadline)}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Plano de ação ainda não definido.</p>'}
        </section>

        <section>${H('Ações de cuidado realizadas pela MindCorp')}
          ${done.length ? `<table style="font-size:.85rem"><thead><tr><th>Data</th><th>Serviço</th><th>Participantes</th><th>Satisfação</th></tr></thead><tbody>${done.map(d => `<tr><td>${fmtDate(d.date)}</td><td>${esc(d.title || svcName(d.serviceId))}<div class="small muted">${esc(svcName(d.serviceId))}</div></td><td>${esc(d.participants || '—')}</td><td>${d.feedbackAvg ? `★ ${d.feedbackAvg} (${d.feedbackCount})` : '—'}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Nenhum serviço registrado como realizado.</p>'}
        </section>

        ${r.comments.length ? `<section>${H('Comentários dos participantes')}<p class="small muted">Transcritos em ordem aleatória, sem identificação.</p>${r.comments.slice(0, 40).map(t => `<p class="small" style="border-left:3px solid var(--mist);padding-left:10px">“${esc(t)}”</p>`).join('')}</section>` : ''}

        <section>${H('Considerações finais')}
          ${a.conclusions ? a.conclusions.split(/\n+/).map(p => `<p>${esc(p)}</p>`).join('') : '<p class="muted">—</p>'}
          <p>Recomenda-se o monitoramento contínuo da eficácia das medidas e a <b>reavaliação dos fatores de risco psicossociais</b> em até 12 meses, ou sempre que ocorrerem mudanças significativas na organização do trabalho, conforme o ciclo do GRO.</p>
          <div class="sig"><div class="line"></div><b>${esc(u.name)}</b><div>Psicóloga${u.crp ? ' – CRP ' + esc(u.crp) : ''}</div><div class="muted">MindCorp – Saúde Mental Organizacional</div></div>
        </section>
      </div>`;
  }

  /* --------------------------- Metodologia ---------------------------- */
  function pageMethod() {
    const c = shell('#/metodologia', '');
    const q = S.catalog.questionnaire;
    c.innerHTML = `<div class="page-head"><div><h1>Metodologia e questionário</h1><p class="muted">Instrumento aplicado aos colaboradores e severidades padrão por fator.</p></div></div>
      <div class="card"><h2>Termo apresentado ao colaborador</h2>${q.intro.text.map(t => `<p>${esc(t)}</p>`).join('')}<p class="small"><b>Consentimento:</b> ${esc(q.intro.consent)}</p></div>
      ${S.catalog.dimensions.map(d => `<div class="card"><div class="card-head"><h3>${esc(d.name)}</h3><span class="badge">Severidade padrão ${d.severity}</span></div>
        <p class="small"><b>Perigo:</b> ${esc(d.hazard)}<br><b>Possíveis agravos:</b> ${esc(d.harms)}</p>
        <ol class="small">${q.dimensions.find(x => x.id === d.id).items.map(i => `<li>${esc(i.text)}</li>`).join('')}</ol>
        <p class="small"><b>Medidas sugeridas:</b></p><ul class="small">${d.actions.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>`).join('')}
      <div class="card"><h2>Catálogo de serviços</h2><table><tbody>${S.catalog.services.map(s => `<tr><td><b>${esc(s.name)}</b><div class="small muted">${esc(s.group)}</div></td><td class="small">${esc(s.description)}</td></tr>`).join('')}</tbody></table></div>`;
  }

  /* ----------------------------- Portfólio ---------------------------- */
  async function pagePortfolio() {
    const c = shell('#/portfolio', '<p class="muted">Carregando…</p>');
    const [pf, companies] = await Promise.all([api('/api/portfolio'), api('/api/companies')]);
    const url = LINK('/portfolio');
    const groups = [...new Set(S.catalog.services.map(x => x.group))];
    const sel = new Set(pf.services);
    let photo = pf.photo || '';
    c.innerHTML = `<div class="page-head"><div><h1>Portfólio</h1><p class="muted">Apresentação da MindCorp para enviar às empresas por link. Edite o conteúdo e salve.</p></div>
        <div class="btns"><a class="btn teal" href="${esc(url)}" target="_blank" rel="noopener">Ver portfólio</a></div></div>
      <div class="grid g2" style="align-items:start">
        <div class="card"><h2>Link para enviar</h2><p class="muted small">Envie por WhatsApp, e-mail ou LinkedIn. Quem abrir não precisa de login.</p>${linkBox(url, 'Ver portfólio')}
          <h3 style="margin-top:18px">Link personalizado para uma empresa</h3><p class="muted small">A página abre com "Apresentação preparada para…" e o nome da empresa.</p>
          <div class="row"><div class="field"><label for="pfor">Nome da empresa</label><input id="pfor" list="pcos" placeholder="Ex.: Indústria Alfa"><datalist id="pcos">${companies.map(x => `<option value="${esc(x.name)}">`).join('')}</datalist></div></div>
          <div id="plink"></div></div>
        <div class="card" style="display:flex;flex-direction:column;align-items:center;gap:10px">${qrImg(url)}<span class="muted small">QR Code do portfólio (para cartões, slides e eventos)</span></div>
      </div>
      <form id="pff">
        <div class="card"><h2>Apresentação</h2>
          <div class="field"><label for="pf-h">Título principal</label><input id="pf-h" name="headline" value="${esc(pf.headline)}"></div>
          <div class="field"><label for="pf-s">Subtítulo</label><input id="pf-s" name="subheadline" value="${esc(pf.subheadline)}"></div>
          <div class="field"><label for="pf-a">Quem somos</label><textarea id="pf-a" name="about">${esc(pf.about)}</textarea></div></div>
        <div class="card"><h2>Responsável técnica</h2><p class="muted small">Nome e CRP vêm de <a href="#/perfil">Meu perfil</a> (${esc(S.user.name)}${S.user.crp ? ' · CRP ' + esc(S.user.crp) : ''}).</p>
          <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><img id="pf-img" alt="Foto" style="width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--mist);${photo ? '' : 'display:none'}" src="${esc(photo)}">
            <div class="btns"><label class="btn ghost" for="pf-file" style="margin:0">Escolher foto</label><input id="pf-file" type="file" accept="image/*" hidden><button type="button" class="btn ghost" id="pf-rm" ${photo ? '' : 'hidden'}>Remover foto</button></div></div>
          <div class="field"><label for="pf-b">Mini currículo</label><textarea id="pf-b" name="bio" placeholder="Formação, especializações, experiência em saúde do trabalhador, empresas atendidas…">${esc(pf.bio)}</textarea></div></div>
        <div class="card"><h2>Serviços exibidos</h2>${groups.map(g => `<h3 style="margin-top:12px">${esc(g)}</h3>${S.catalog.services.filter(x => x.group === g).map(x => `<label class="check"><input type="checkbox" class="pf-svc" value="${x.id}" ${sel.has(x.id) ? 'checked' : ''}> <span>${esc(x.name)} <span class="muted small">· ${esc(x.description)}</span></span></label>`).join('')}`).join('')}</div>
        <div class="card"><h2>Palestras</h2>
          <label class="check"><input type="checkbox" id="pf-talks" ${pf.showTalks ? 'checked' : ''}> Mostrar as palestras da biblioteca de materiais</label>
          <div class="field" style="margin-top:12px"><label for="pf-x">Outros temas (um por linha)</label><textarea id="pf-x" name="extraTopics" placeholder="Inteligência emocional&#10;Gestão do tempo e produtividade saudável">${esc(pf.extraTopics)}</textarea></div></div>
        <div class="card"><h2>Contato</h2>
          <div class="row"><div class="field"><label for="pf-w">WhatsApp (com DDD)</label><input id="pf-w" name="whatsapp" value="${esc(pf.whatsapp)}" placeholder="(11) 99999-9999"></div><div class="field"><label for="pf-p">Telefone</label><input id="pf-p" name="phone" value="${esc(pf.phone)}"></div></div>
          <div class="row"><div class="field"><label for="pf-e">E-mail</label><input id="pf-e" name="email" type="email" value="${esc(pf.email)}"></div><div class="field"><label for="pf-i">Instagram</label><input id="pf-i" name="instagram" value="${esc(pf.instagram)}" placeholder="@mindcorp"></div></div>
          <div class="row"><div class="field"><label for="pf-site">Site</label><input id="pf-site" name="website" value="${esc(pf.website)}"></div><div class="field"><label for="pf-c">Região de atendimento</label><input id="pf-c" name="city" value="${esc(pf.city)}" placeholder="São Paulo e região · on-line para todo o Brasil"></div></div>
          <p class="hint">Com o WhatsApp preenchido, o portfólio ganha o botão "Agendar uma conversa".</p></div>
        <div class="btns" style="margin-top:18px"><button class="btn">Salvar portfólio</button><a class="btn ghost" href="${esc(url)}" target="_blank" rel="noopener">Ver portfólio</a></div>
      </form>`;
    const pl = c.querySelector('#plink');
    const updLink = () => { const n = c.querySelector('#pfor').value.trim(); pl.innerHTML = n ? linkBox(LINK('/portfolio?para=' + encodeURIComponent(n)), 'Ver portfólio') : ''; };
    c.querySelector('#pfor').oninput = updLink;
    const img = c.querySelector('#pf-img'), rm = c.querySelector('#pf-rm');
    c.querySelector('#pf-file').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        const im = new Image();
        im.onload = () => {
          const k = Math.min(1, 480 / Math.max(im.width, im.height));
          const cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
          cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
          photo = cv.toDataURL('image/jpeg', 0.85);
          img.src = photo; img.style.display = ''; rm.hidden = false;
        };
        im.onerror = () => toast('Não foi possível ler esta imagem', true);
        im.src = r.result;
      };
      r.readAsDataURL(f);
    };
    rm.onclick = () => { photo = ''; img.style.display = 'none'; rm.hidden = true; };
    c.querySelector('#pff').onsubmit = async e => {
      e.preventDefault();
      const body = formData(e.target);
      body.services = [...c.querySelectorAll('.pf-svc:checked')].map(i => i.value);
      body.showTalks = c.querySelector('#pf-talks').checked;
      body.photo = photo;
      try { await api('/api/portfolio', { method: 'PUT', body }); toast('Portfólio salvo'); } catch (err) { toast(err.message, true); }
    };
  }

  /* ------------------------- Cópia de segurança ------------------------ */
  const pl = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const daysSince = iso => iso ? Math.floor((Date.now() - new Date(iso)) / 864e5) : null;
  function backupReminder(d) {
    if (MC.standalone || !d.companies) return '';
    const n = daysSince(d.lastBackupAt);
    if (n !== null && n < 7) return '';
    return `<div class="card" style="margin-bottom:18px;border-left:4px solid var(--r-moderado);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div><b>${n === null ? 'Você ainda não baixou uma cópia de segurança.' : `Sua última cópia de segurança foi há ${n} dias.`}</b><div class="muted small">Guarde uma cópia dos dados no seu computador pelo menos uma vez por semana.</div></div>
      <a class="btn" href="#/backup">Fazer cópia agora</a></div>`;
  }
  async function downloadBackup() {
    const data = await api('/api/backup');
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `mindcorp-copia-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    return data;
  }
  async function pageBackup() {
    const c = shell('#/backup', '<p class="muted">Carregando…</p>');
    const d = await api('/api/dashboard');
    const n = daysSince(d.lastBackupAt);
    c.innerHTML = `<div class="page-head"><div><h1>Cópia de segurança</h1><p class="muted">Guarde no seu computador uma cópia de todos os dados do app e restaure se algo der errado.</p></div></div>
      ${MC.standalone ? '<div class="card" style="margin-bottom:18px;border-left:4px solid var(--teal)"><b>Na demonstração do chat não é possível baixar arquivos.</b><div class="muted small">Esta tela funciona na versão publicada do app (Render).</div></div>' : ''}
      <div class="grid g2" style="align-items:start">
        <div class="card"><h2>Baixar cópia</h2>
          <p>Gera um arquivo com empresas, serviços, materiais, avaliações, respostas, portfólio e login. O arquivo vai para a pasta <b>Downloads</b> do seu computador.</p>
          <p class="small ${n === null || n >= 7 ? '' : 'muted'}">${d.lastBackupAt ? `Última cópia: <b>${fmtDate(d.lastBackupAt)}</b> (${n === 0 ? 'hoje' : n === 1 ? 'ontem' : `há ${n} dias`}).` : 'Nenhuma cópia feita ainda.'}</p>
          <button class="btn" id="bk-dl" ${MC.standalone ? 'disabled' : ''}>Baixar cópia de segurança</button>
          <div class="hint" style="margin-top:12px">Guarde o arquivo em local seguro (ex.: Google Drive ou pendrive). Ele contém respostas das pesquisas e deve ser tratado como dado sigiloso, conforme a LGPD.</div></div>
        <div class="card"><h2>Restaurar cópia</h2>
          <p>Substitui <b>todos</b> os dados atuais do app pelos dados do arquivo escolhido. Use depois de uma perda de dados ou ao trocar de servidor.</p>
          <p class="small muted">Por segurança, antes de restaurar o app baixa automaticamente uma cópia dos dados atuais.</p>
          <label class="btn ghost" for="bk-file" style="margin:0;${MC.standalone ? 'opacity:.5;pointer-events:none' : ''}">Escolher arquivo…</label><input id="bk-file" type="file" accept=".json,application/json" hidden>
          <div id="bk-info" style="margin-top:14px"></div></div>
      </div>`;
    const dl = c.querySelector('#bk-dl');
    dl.onclick = async () => {
      dl.disabled = true;
      try { await downloadBackup(); toast('Cópia baixada. Confira a pasta Downloads.'); pageBackup(); }
      catch (err) { toast(err.message, true); dl.disabled = false; }
    };
    c.querySelector('#bk-file').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const info = c.querySelector('#bk-info');
      const r = new FileReader();
      r.onload = async () => {
        let data;
        try { data = JSON.parse(r.result); } catch { info.innerHTML = '<p style="color:var(--danger)">Este arquivo não é uma cópia de segurança válida.</p>'; return; }
        const dd = data && data.data;
        if (!dd || data.app !== 'mindcorp') { info.innerHTML = '<p style="color:var(--danger)">Este arquivo não foi gerado pelo app MindCorp.</p>'; return; }
        const cnt = k => Array.isArray(dd[k]) ? dd[k].length : 0;
        info.innerHTML = `<div class="card" style="background:var(--ice)"><b>${esc(f.name)}</b><div class="small">Cópia de ${fmtDate(data.exportedAt)} · ${pl(cnt('companies'), 'empresa', 'empresas')} · ${pl(cnt('campaigns'), 'avaliação', 'avaliações')} · ${pl(cnt('responses'), 'resposta', 'respostas')} · ${pl(cnt('deliveries'), 'serviço', 'serviços')}</div>
          <button class="btn danger" id="bk-go" style="margin-top:12px">Restaurar esta cópia</button></div>`;
        info.querySelector('#bk-go').onclick = async () => {
          if (!(await confirmBox('Todos os dados atuais serão substituídos pelos dados desta cópia. Antes disso, uma cópia dos dados atuais será baixada. Continuar?'))) return;
          try {
            await downloadBackup();
            const res = await api('/api/backup/restore', { method: 'POST', body: data });
            toast(`Cópia restaurada: ${pl(res.counts.companies, 'empresa', 'empresas')} e ${pl(res.counts.responses, 'resposta', 'respostas')}`);
            const ses = await api('/api/session');
            S.user = ses.user;
            if (!S.user) return boot();
            pageBackup();
          } catch (err) { toast(err.message, true); }
        };
      };
      r.readAsText(f);
      e.target.value = '';
    };
  }

  /* ------------------------------ Perfil ------------------------------ */
  function pageProfile() {
    const c = shell('#/perfil', '');
    const u = S.user;
    c.innerHTML = `<div class="page-head"><div><h1>Meu perfil</h1><p class="muted">Estes dados aparecem na assinatura dos relatórios.</p></div></div>
      <div class="card" style="max-width:620px"><form id="pf">
        <div class="field"><label>Nome completo</label><input name="name" value="${esc(u.name)}" required></div>
        <div class="row"><div class="field"><label>CRP</label><input name="crp" value="${esc(u.crp)}"></div><div class="field"><label>Telefone</label><input name="phone" value="${esc(u.phone)}"></div></div>
        <div class="field"><label>E-mail (login)</label><input name="email" type="email" value="${esc(u.email)}" required></div>
        <div class="field"><label>Nova senha</label><input name="password" type="password" minlength="8" placeholder="Deixe em branco para manter" autocomplete="new-password"></div>
        <button class="btn">Salvar</button></form></div>`;
    c.querySelector('#pf').onsubmit = async e => {
      e.preventDefault();
      const b = formData(e.target); if (!b.password) delete b.password;
      try { const r = await api('/api/me', { method: 'PUT', body: b }); S.user = r.user; toast('Perfil atualizado'); pageProfile(); } catch (err) { toast(err.message, true); }
    };
  }

  /* ------------------------------ Router ------------------------------ */
  async function route() {
    if (!S.user) return boot();
    if (!S.catalog) S.catalog = await api('/api/catalog');
    const [path, qs] = MC.current().replace(/^#/, '').split('?');
    const q = new URLSearchParams(qs || '');
    const p = (path || '/').split('/').filter(Boolean);
    window.scrollTo(0, 0);
    try {
      if (!p.length) return await pageHome();
      if (p[0] === 'empresas') return p[1] ? await pageCompany(p[1], p[2]) : await pageCompanies(q);
      if (p[0] === 'cartaz') return await pagePoster(p[1]);
      if (p[0] === 'agenda') return await pageAgenda(q);
      if (p[0] === 'materiais') return p[1] ? await pageMaterial(p[1]) : await pageMaterials(q);
      if (p[0] === 'avaliacoes') return p[1] ? await pageCampaign(p[1], p[2]) : await pageCampaigns(q);
      if (p[0] === 'relatorio') return await pageReport(p[1]);
      if (p[0] === 'metodologia') return pageMethod();
      if (p[0] === 'portfolio') return await pagePortfolio();
      if (p[0] === 'backup') return pageBackup();
      if (p[0] === 'perfil') return pageProfile();
      await pageHome();
    } catch (err) {
      if (err.status === 401) { S.user = null; return boot(); }
      toast(err.message, true);
    }
  }

  async function boot() {
    const s = await api('/api/session');
    if (s.user) { S.user = s.user; return route(); }
    authScreen(s.needsSetup);
  }

  MC.onNavigate(() => { document.querySelector('.modal-bg')?.remove(); document.getElementById('sb')?.classList.remove('open'); route(); });
  MC.route = route;
  boot();
})();

</script>
